version: 2

models:
  - name: stg_stackadapt__advertiser
    description: Cleaned and renamed advertiser records from StackAdapt. One row per advertiser.
    columns:
      - name: advertiser_key
        description: Surrogate key derived from source_relation and advertiser_id.
        tests:
          - not_null
          - unique
      - name: source_relation
        description: >
          {{ doc("source_relation") }}
      - name: advertiser_id
        description: >
          {{ doc("advertiser_id") }}
        tests:
          - not_null
      - name: advertiser_name
        description: >
          {{ doc("advertiser_name") }}
      - name: description
        description: Description of the advertiser.
      - name: is_archived
        description: >
          {{ doc("is_archived") }}

  - name: stg_stackadapt__advertiser_delivery
    description: Daily delivery metrics at the advertiser level. One row per advertiser per day.
    columns:
      - name: source_relation
        description: >
          {{ doc("source_relation") }}
      - name: advertiser_delivery_key
        description: Surrogate key derived from source_relation, advertiser_id, and date_day.
        tests:
          - not_null
          - unique
      - name: advertiser_id
        description: >
          {{ doc("advertiser_id") }}
      - name: date_day
        description: >
          {{ doc("date_day") }}
      - name: impressions
        description: >
          {{ doc("impressions") }}
      - name: clicks
        description: >
          {{ doc("clicks") }}
      - name: spend
        description: >
          {{ doc("spend") }}
      - name: conversions
        description: >
          {{ doc("conversions") }}

  - name: stg_stackadapt__campaign_group
    description: Cleaned and renamed campaign group records from StackAdapt. One row per campaign group.
    columns:
      - name: campaign_group_key
        description: Surrogate key derived from source_relation and campaign_group_id.
        tests:
          - not_null
          - unique
      - name: source_relation
        description: >
          {{ doc("source_relation") }}
      - name: campaign_group_id
        description: >
          {{ doc("campaign_group_id") }}
        tests:
          - not_null
      - name: campaign_group_name
        description: >
          {{ doc("campaign_group_name") }}
      - name: budget_rollover
        description: Whether unspent budget rolls over to the next period.
      - name: budget_type
        description: The type of budget applied to this campaign group.
      - name: domain_exclusions
        description: Domains excluded from ad delivery for this campaign group.
      - name: domains
        description: Domains targeted for ad delivery for this campaign group.
      - name: freq_cap_expiry
        description: The time window in hours for the frequency cap.
      - name: freq_cap_limit
        description: The maximum number of ad impressions per user within the frequency cap window.
      - name: is_archived
        description: >
          {{ doc("is_archived") }}
      - name: is_inventory_packages_strict
        description: Whether inventory package targeting is applied strictly.
      - name: revenue_pricing
        description: The revenue pricing value for this campaign group.
      - name: revenue_type
        description: The revenue pricing model for this campaign group.
      - name: timezone
        description: The timezone used for scheduling and reporting this campaign group.
      - name: created_at
        description: >
          {{ doc("created_at") }}

  - name: stg_stackadapt__campaign_group_delivery
    description: Daily delivery metrics at the campaign group level. One row per campaign group per campaign per day.
    columns:
      - name: source_relation
        description: >
          {{ doc("source_relation") }}
      - name: campaign_group_delivery_key
        description: Surrogate key derived from source_relation, campaign_group_id, and date_day.
        tests:
          - not_null
          - unique
      - name: campaign_group_id
        description: >
          {{ doc("campaign_group_id") }}
      - name: advertiser_id
        description: >
          {{ doc("advertiser_id") }}
      - name: date_day
        description: >
          {{ doc("date_day") }}
      - name: impressions
        description: >
          {{ doc("impressions") }}
      - name: clicks
        description: >
          {{ doc("clicks") }}
      - name: spend
        description: >
          {{ doc("spend") }}
      - name: conversions
        description: >
          {{ doc("conversions") }}

