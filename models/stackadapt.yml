version: 2

models:
  - name: stackadapt__advertiser_report
    description: Daily advertiser-level performance report for StackAdapt. One row per advertiser per day.
    columns:
      - name: advertiser_report_key
        description: Surrogate key derived from date_day, advertiser_id, and source_relation.
        tests:
          - not_null
          - unique
      - name: source_relation
        description: >
          {{ doc("source_relation") }}
      - name: date_day
        description: >
          {{ doc("date_day") }}
        tests:
          - not_null
      - name: advertiser_id
        description: >
          {{ doc("advertiser_id") }}
        tests:
          - not_null
      - name: advertiser_name
        description: >
          {{ doc("advertiser_name") }}
      - name: is_archived
        description: >
          {{ doc("is_archived") }}
      - name: impressions
        description: Total number of ad impressions served.
      - name: clicks
        description: Total number of ad clicks.
      - name: spend
        description: Total advertising spend.
      - name: conversions
        description: Total number of conversions recorded.

  - name: stackadapt__campaign_group_report
    description: Daily campaign group-level performance report for StackAdapt. One row per campaign group per day. Aggregated from campaign group-level delivery data within each campaign group.
    columns:
      - name: campaign_group_report_key
        description: Surrogate key derived from date_day, campaign_group_id, and source_relation.
        tests:
          - not_null
          - unique
      - name: source_relation
        description: >
          {{ doc("source_relation") }}
      - name: date_day
        description: >
          {{ doc("date_day") }}
        tests:
          - not_null
      - name: campaign_group_id
        description: >
          {{ doc("campaign_group_id") }}
        tests:
          - not_null
      - name: campaign_group_name
        description: >
          {{ doc("campaign_group_name") }}
      - name: is_archived
        description: >
          {{ doc("is_archived") }}
      - name: advertiser_id
        description: >
          {{ doc("advertiser_id") }}
      - name: advertiser_name
        description: >
          {{ doc("advertiser_name") }}
      - name: impressions
        description: Total number of ad impressions served across all campaigns in the campaign group.
      - name: clicks
        description: Total number of ad clicks across all campaigns in the campaign group.
      - name: spend
        description: Total advertising spend across all campaigns in the campaign group.
      - name: conversions
        description: Total number of conversions recorded across all campaigns in the campaign group.

