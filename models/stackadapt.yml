          - unique
      - name: source_relation
        description: >
          {{ doc("source_relation") }}
      - name: date_day
        description: >
          {{ doc("date_day") }}
        tests:
          - not_null
      - name: campaign_id
        description: >
          {{ doc("campaign_id") }}
        tests:
          - not_null
      - name: campaign_name
        description: >
          {{ doc("campaign_name") }}
      - name: campaign_state
        description: >
          {{ doc("campaign_state") }}
      - name: campaign_status
        description: >
          {{ doc("campaign_status") }}
      - name: channel_type
        description: >
          {{ doc("channel_type") }}
      - name: advertiser_id
        description: >
          {{ doc("advertiser_id") }}
      - name: advertiser_name
        description: >
          {{ doc("advertiser_name") }}
      - name: campaign_group_id
        description: >
          {{ doc("campaign_group_id") }}
      - name: campaign_group_name
        description: >
          {{ doc("campaign_group_name") }}
      - name: impressions
        description: Total number of ad impressions served.
      - name: clicks
        description: Total number of ad clicks.
      - name: spend
        description: Total advertising spend.
      - name: conversions
        description: Total number of conversions recorded.

